<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>יורוליג 2026/27 · תחזית נקודות פנטזי</title>
<style>
:root{
  --bg:#0d1526; --panel:#152036; --panel2:#1b2a46; --line:#2a3b5c; --text:#e8eef9; --muted:#9aabc8;
  --accent:#ff8a1f; --m1:#4fa3ff; --m2:#2ec4a0; --good:#2ec47a; --bad:#ff6b6b; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Rubik,Arial,"Noto Sans Hebrew",sans-serif;font-size:15px}
a{color:inherit}
header{background:linear-gradient(135deg,#142642,#0d1526 70%);border-bottom:1px solid var(--line);padding:18px 20px 0}
.wrap{max-width:1200px;margin:0 auto}
h1{margin:0;font-size:24px;display:flex;align-items:center;gap:10px}
h1 .ball{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffb066,#ff7a00 60%,#c95400);box-shadow:0 0 0 2px #0003 inset}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
nav{display:flex;gap:4px;margin-top:16px;flex-wrap:wrap}
nav button{background:none;border:none;color:var(--muted);font:inherit;font-weight:600;padding:10px 16px;border-radius:10px 10px 0 0;cursor:pointer}
nav button.on{background:var(--bg);color:var(--text);box-shadow:inset 0 3px 0 var(--accent)}
main{padding:20px}
section.tab{display:none} section.tab.on{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:8px}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.m1{background:var(--m1)} .dot.m2{background:var(--m2)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12.5px}
td.num,th.num{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
tbody tr:hover{background:var(--panel2)}
.rk{width:30px;color:var(--muted);font-weight:700}
.pl{cursor:pointer}
.pl b{display:block;font-weight:600}
.pl small{color:var(--muted);font-size:12px}
.pl:hover b{color:var(--accent)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
.score{font-weight:700}
.m1c{color:var(--m1)} .m2c{color:var(--m2)}
/* fixtures */
.day{margin:6px 0 18px}
.day h3{margin:0 0 10px;font-size:15px;color:var(--muted)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.game{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.game .t{font-weight:600;text-align:center;line-height:1.3}
.game .t small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;margin-top:3px}
.game .mid{text-align:center;color:var(--muted);font-size:13px}
.game .mid b{display:block;color:var(--text);font-size:18px;direction:ltr}
.game.played{opacity:.55}
/* search */
.sbox{position:relative;max-width:560px}
.sbox input{width:100%;padding:13px 44px 13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:16px;outline:none}
.sbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #ff8a1f33}
.sbox:before{content:"⌕";position:absolute;right:14px;top:9px;font-size:22px;color:var(--muted)}
.ac{position:absolute;top:calc(100% + 4px);right:0;left:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;z-index:20;max-height:360px;overflow:auto;display:none;box-shadow:0 12px 30px #0008}
.ac.on{display:block}
.ac div{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ac div.sel,.ac div:hover{background:#ff8a1f22}
.ac div b{font-weight:600}
.ac div small{color:var(--muted);font-size:12px}
.ac mark{background:none;color:var(--accent);font-weight:700}
.ac .none{color:var(--muted);cursor:default}
.player{margin-top:18px}
.phead{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.phead h2{font-size:22px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.chip b{font-size:15px;margin-inline-start:6px;direction:ltr;display:inline-block}
.opp{font-size:14px}
.opp b{color:var(--accent)}
.models{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:900px){.models{grid-template-columns:1fr}}
.model{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--panel)}
.model.m1{border-top:3px solid var(--m1)} .model.m2{border-top:3px solid var(--m2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.kpi{background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.kpi span{display:block;color:var(--muted);font-size:12px}
.kpi b{font-size:22px;direction:ltr;display:inline-block}
.kpi small{display:block;color:var(--muted);font-size:11.5px;direction:ltr}
.comp td{white-space:normal;vertical-align:top}
.comp .f{display:block;color:var(--muted);font-size:11.5px;direction:ltr;text-align:right;margin-top:2px}
.comp tr.total td{border-top:2px solid var(--line);font-weight:700}
.btn{background:var(--accent);color:#1a0f00;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.cmpbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.pchip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px}
.pchip i{font-style:normal;width:10px;height:10px;border-radius:50%}
.pchip button{background:#ffffff14;border:none;color:var(--muted);width:22px;height:22px;border-radius:50%;cursor:pointer}
.cmp{margin-top:16px}
.cmp th.pc{text-align:center;min-width:150px}
.cmp td.sec{background:var(--panel2);color:var(--accent);font-weight:700;font-size:13px}
.cmp td.best{color:var(--good);font-weight:700}
.note{color:var(--muted);font-size:12.5px;line-height:1.6}
.warn{background:#ff6b6b18;border:1px solid #ff6b6b55;border-radius:10px;padding:10px 12px;margin-top:12px}
/* opponents */
.opp-t th{cursor:pointer;user-select:none}
.opp-t th.sorted{color:var(--accent)}
.opp-t th.sorted:after{content:attr(data-dir);margin-inline-start:4px}
.opp-t td.num,.opp-t th.num{text-align:center}
.opp-t td.cell{cursor:pointer;font-weight:600}
.opp-t td.cell:hover,.opp-t td.cell.on{outline:2px solid var(--accent);outline-offset:-2px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:#1a0f00}
.opp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.matchup{margin-top:16px;border-top:3px solid var(--accent)}
.matchup .x{float:left;background:#ffffff14;border:none;color:var(--muted);width:26px;height:26px;border-radius:50%;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend .sw{display:inline-block;width:46px;height:12px;border-radius:3px;background:linear-gradient(270deg,#ff6b6b99,transparent,#2ec47a99);vertical-align:middle;margin:0 6px}
/* actual / live */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.final{background:#2ec47a26;color:var(--good);border:1px solid #2ec47a66}
.badge.live{background:#ff3b3b26;color:#ff6b6b;border:1px solid #ff6b6b88}
.badge.live i{width:7px;height:7px;border-radius:50%;background:#ff4d4d;animation:pulse 1.2s infinite}
.badge.sm{padding:0 6px;font-size:11px;margin-inline-start:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.actual{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px}
.actual small{flex-basis:100%;color:var(--muted);font-size:12px}
.actual.final{background:#2ec47a14;border:1px solid #2ec47a55}
.actual.live{background:#ff3b3b14;border:1px solid #ff6b6b66}
.cmp td.sec.real{color:var(--good);background:#2ec47a1a}
.cmp tr.real td{background:#2ec47a0a}
.cmphead .phead h2{margin:0}
.roundnote{margin-top:6px;font-size:12.5px;color:var(--accent)}
/* compare header: photo + frozen row */
.cmp thead th{position:sticky;top:0;z-index:3;background:var(--panel);box-shadow:0 2px 0 var(--line);vertical-align:bottom}
.cmp .scroll{max-height:82vh;overflow:auto}
@media(min-width:760px){ .cmp .scroll{max-height:none;overflow:visible} }
.pcw{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pcw small{display:block;margin-top:2px}
.ph{width:64px;height:64px;border-radius:50%;border:3px solid;background:var(--panel2) center 15%/cover no-repeat;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--muted)}
/* fixtures navigation + leaders */
.rnav{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:center}
.rnav h2{justify-content:center}
.game.played{opacity:1} .game.played .t{opacity:.9}
.game.is-live{border-color:#ff6b6b88}
.game .t small.lead-final{color:var(--good)}
.game .t small.lead-live{color:#ff8b8b}
/* top15 actual column + hits table */
td.act small{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
td.act .up{color:var(--good)} td.act .down{color:var(--bad)}
.hits th.grp{text-align:center}
.hits td.best{color:var(--good);font-weight:700}
.hits tr.avg td{border-top:2px solid var(--line)}
.hits tr.partial td{opacity:.85}
.hits td small.note{font-size:11px}
/* builder */
.bctl{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:8px}
.bctl input[type=range]{width:260px;vertical-align:middle;margin-inline-start:8px;accent-color:var(--accent)}
.bctl .chk{font-size:13px;color:var(--muted)}
.badge.cap{background:#ff8a1f26;color:var(--accent);border:1px solid #ff8a1f88}
.five tfoot td{border-top:2px solid var(--line);font-size:15px}
.chip.warnchip{border-color:#ff6b6b88;color:#ff8b8b}
/* keep wide tables inside their column */
.grid2>*{min-width:0}
#tops td:nth-child(3){white-space:normal;min-width:110px}
#tops th,#tops td{padding:7px 5px}
#tops td.pl{white-space:normal;min-width:120px}
/* single-model layout */
.stack{display:flex;flex-direction:column;gap:18px}
.models{grid-template-columns:1fr}
/* court view */
.court{position:relative;max-width:560px;margin:0 auto;padding:18px 8px;border-radius:14px;
  background:linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 34px),linear-gradient(180deg,#e2b57c,#d29c5d);
  box-shadow:inset 0 0 0 4px #fff3, 0 10px 30px #0006;display:flex;flex-direction:column;gap:22px}
.court .lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.court .lines *{stroke:#fff;stroke-width:.6;vector-effect:non-scaling-stroke;stroke-opacity:.9}
.crow{position:relative;display:flex;justify-content:center;gap:14px;flex-wrap:nowrap}
.ccard{position:relative;width:min(30vw,128px);background:#fff;border-radius:10px;box-shadow:0 4px 10px #0005;
  text-align:center;color:#1b1b1b;padding:10px 6px 6px;cursor:pointer}
.ccard:hover{transform:translateY(-2px)}
.cph{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;background:#e9e9e9 center 10%/cover no-repeat;border:2px solid #eee}
.cph.ini{display:flex;align-items:center;justify-content:center;font-weight:800;color:#777;font-size:20px}
.cfp{position:absolute;top:-10px;left:-6px;background:#1fb55e;color:#fff;font-weight:800;border-radius:999px;padding:2px 9px;font-size:14px;box-shadow:0 2px 6px #0004}
.ccap{position:absolute;top:-10px;right:-6px;width:26px;height:26px;border-radius:50%;background:#fff;color:#c0262d;border:2px solid #c0262d;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.cname{font-weight:700;font-size:13.5px;line-height:1.2}
.cmeta{font-size:11px;color:#666;margin-top:2px}
.csum{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.csum>div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center;min-width:140px}
.csum span{display:block;color:var(--muted);font-size:12px}
.csum b{font-size:20px}
.csum small{display:block;color:var(--muted);font-size:11.5px}
@media(max-width:520px){ .crow{gap:6px} .cph{width:48px;height:48px} .cname{font-size:12px} .bctl input[type=range]{width:100%} }
/* filter search */
.filt{margin-top:14px}
.filt summary{cursor:pointer;list-style:none} .filt summary::-webkit-details-marker{display:none}
.filt summary h2:before{content:"▸ ";color:var(--accent)} .filt[open] summary h2:before{content:"▾ "}
.fctl{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin:10px 0}
.fctl input[type=range]{width:200px;vertical-align:middle;margin-inline-start:8px;accent-color:var(--accent)}
.fctl .chk{font-size:13px;color:var(--muted)}
/* builder exclude */
.cx{position:absolute;bottom:4px;left:4px;width:22px;height:22px;border-radius:50%;border:1px solid #ddd;background:#fff;color:#c0262d;font-weight:800;cursor:pointer;font-size:11px;line-height:1}
.cx:hover{background:#c0262d;color:#fff}
.exl{font-size:13px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.btn.sm{padding:4px 10px;font-size:12.5px}
/* bench */
.bench{margin-top:14px;padding:14px 8px;border-radius:14px;background:repeating-linear-gradient(90deg,#3b2f25 0 10px,#33281f 10px 20px);max-width:560px;margin-inline:auto}
.btitle{color:#f0d9bd;text-align:center;font-weight:700;font-size:13px;margin-bottom:12px}
.bcard{opacity:.95}
.chalf{direction:ltr;position:absolute;top:-10px;right:-6px;background:#5b6b86;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px}
.ccard{padding-bottom:28px}
.cx{bottom:4px}
/* coaches */
.coaches{margin-top:16px;text-align:center}
.coaches h3{font-size:14px;color:var(--muted);margin:0 0 8px}
.clist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.coach{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.coach small{color:var(--muted)}
.coach.blocked{opacity:.45;text-decoration:line-through}
/* my team */
.mtform{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.mtform input{flex:1;min-width:200px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:16px}
.mt-head .kpis{grid-template-columns:repeat(3,1fr)}
.trow{display:grid;grid-template-columns:90px 1fr 130px;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.trow.best{background:#2ec47a14;border:1px solid #2ec47a55;border-radius:10px}
.trow .tk{font-weight:700}
.trow .out{color:#ff8b8b} .trow .in{color:var(--good)}
.trow .tg{text-align:center} .trow .tg b{font-size:20px;display:block} .trow .tg small{color:var(--muted);font-size:11.5px}
@media(max-width:600px){ .trow{grid-template-columns:1fr} .mt-head .kpis{grid-template-columns:1fr 1fr 1fr} }
/* ownership / my team extras */
.ccap.vc{color:#5b6b86;border-color:#5b6b86;font-size:10px}
.trow .rank{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#1a0f00;align-items:center;justify-content:center;font-size:12px;margin-inline-end:4px}
.hzl{font-size:13px;color:var(--muted)} .hzl select{margin-inline-start:6px;padding:6px 8px;border-radius:8px;background:var(--panel2);color:var(--text);border:1px solid var(--line);font:inherit}
.mtform.sbox{max-width:none} .mtform.sbox:before{display:none} .mtform .ac{top:calc(100% + 2px)}
.trow.pick{cursor:pointer;border-radius:10px} .trow.pick:hover{background:#ffffff0a}
.trow.pick.best:after{content:"מוצג ✓";grid-column:1/-1;font-size:11.5px;color:var(--good);text-align:center}
.cfp.neg{background:#c0392b}
.coachcard .cph.ini{font-size:30px}
.coachrow{margin-top:10px}
/* ---------- mobile ---------- */
.ts{display:none}
@media(max-width:600px){
  .tl{display:none} .ts{display:inline}
  nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;padding-bottom:10px}
  nav button{white-space:nowrap;padding:9px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:14px}
  nav button.on{background:var(--accent);color:#1a0f00;box-shadow:none;border-color:var(--accent)}
  main{padding:14px 10px} .card{padding:12px}
  h1{font-size:19px}
  .col-score,.col-price{display:none}
  #tops th,#tops td{padding:6px 3px;font-size:13px} #tops td.pl{min-width:0} #tops td:nth-child(3){min-width:0}
  .opp-t th,.opp-t td{padding:6px 3px;font-size:12.5px}
  .cmp th,.cmp td{padding:6px 3px;font-size:12px}
  .cmp td:first-child{white-space:normal;min-width:84px;max-width:110px}
  .cmp th.pc{min-width:0}
  .cmp .ph{width:42px;height:42px;font-size:14px;border-width:2px}
  .cmp .pcw b{font-size:12px}
  .cmp .scroll{max-height:none;overflow-x:auto}
  .cmp td.num{white-space:normal}
  .cmp table{table-layout:fixed;width:100%}
  .cmp th,.cmp td{white-space:normal;overflow-wrap:anywhere}
  .cmp thead th:first-child,.cmp td:first-child{width:27%}
  .cmp .pcw small{font-size:10.5px}
  .opp-t td.note{white-space:normal;font-size:11.5px}
  .trow{padding:8px}
  #myTeamView table th,#myTeamView table td{padding:6px 3px;font-size:12.5px}
  #myTeamView table td.pl{white-space:normal}
}
.brow{align-items:stretch}
.brow .vsep{align-self:stretch;width:2px;background:#f0d9bd55;border-radius:2px;margin:0 2px}
.bsep{color:#f0d9bd88;margin:0 4px}
.coachcard .cph{background-size:cover;background-position:center 20%}
@media(max-width:600px){ .brow{gap:5px} .brow .ccard{width:calc((100% - 30px)/4);min-width:0;padding:8px 3px 26px} .brow .cph{width:40px;height:40px}
  .brow .cname{font-size:11px} .brow .cmeta{font-size:9.5px} .brow .cfp{font-size:11.5px;padding:1px 6px} .brow .chalf{font-size:9.5px;padding:1px 4px;right:-3px} }
.cact{margin-top:4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.cact small{font-size:10.5px;color:#666;direction:ltr}
.game .t small.coach-final{color:#e6c38f}
.coachcard .cph.logo{background-size:70%;background-position:center;background-color:#fff}
.cfp{direction:ltr;unicode-bidi:isolate}
footer{color:var(--muted);font-size:12px;padding:10px 20px 30px;text-align:center}
.empty{color:var(--muted);padding:30px;text-align:center}
</style>
</head>
<body>

const LIVE = {data:null, rows:[], map:new Map(), direct:new Map(), round:M.next_round, nPlayed:0, nFinal:0, roundDone:false};
const akey = (raw,team)=>raw+'||'+team;
function rebuildLive(){
  const L = LIVE.data; LIVE.map = new Map();
  if(!L || (M.next_round && L.round!==M.next_round)) { LIVE.nPlayed=LIVE.nFinal=0; return; }
  LIVE.round = L.round; LIVE.roundDone = L.round_finished>=L.round_games;
  let rows = (L.actual||[]).map(a=>({...a, asof:L.updated_utc}));
  // live rows fetched directly from the API in the browser replace the server's live rows
  if(LIVE.direct.size){
    rows = rows.filter(a=>a.status==='final' || !LIVE.direct.has(String(a.game)));
    LIVE.direct.forEach((v,g)=>{ const lg=liveGame(g); if(!(lg&&lg.status==='final')) rows.push(...v); });
  }
  rows.sort((a,b)=>b.pir-a.pir);
  rows.forEach(a=>{ a.rank = 1+rows.filter(b=>b.pir>a.pir).length; });
  LIVE.nPlayed = rows.length; LIVE.nFinal = rows.filter(a=>a.status==='final').length;
  // rank among finished games only for final rows
  const fin = rows.filter(a=>a.status==='final');
  fin.forEach(a=>{ a.rank = 1+fin.filter(b=>b.pir>a.pir).length; });
  rows.forEach(a=>LIVE.map.set(akey(a.raw,a.team),a));
  LIVE.rows = rows;
}
const getActual = p => LIVE.map.get(akey(p.raw,p.team)) || null;
const teamNext = t => (LIVE.data && LIVE.data.next_game && LIVE.data.next_game[t]) || null;
function nextAfter(p){
  const a = getActual(p); if(!a || a.status!=='final') return '';
  const n = teamNext(p.team);
  return n ? ` · <span class="note">הבאה: ${n.venue==='Home'?'נגד':'@'} ${esc(n.vs)} (מחזור ${n.round})</span>` : '';
}
function liveGame(g){ return LIVE.data && (LIVE.data.games||[]).find(x=>String(x.game)===String(g)); }

async function loadLive(){
  if(location.protocol==='file:') return;
  try{
    const r = await fetch('live.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const j = await r.json();
    if(LIVE.data && j.updated_utc===LIVE.data.updated_utc) return;
    LIVE.data = j; rebuildLive(); renderAll();
  }catch(e){}
}
// Best effort: if the EuroLeague API allows browser requests, read games in progress every minute.
const API = 'https://api-live.euroleague.net/v2/competitions/E/seasons/E2026/games/';
const secs = v => { if(v==null) return NaN; if(typeof v==='object') v=v.value??v.total??v.seconds;
  const s=String(v); const m=s.match(/^(\d+):(\d{2})$/); return m? +m[1]*60+ +m[2] : +s; };
const pname = o => { if(!o) return ''; if(typeof o!=='object') return String(o);
  if(o.person) return pname(o.person); return o.name||o.fullName||[o.lastName,o.firstName].filter(Boolean).join(', '); };
// Fantasy points of one v2 box-score line (sport5 rules; same as the R pipeline).
function fpLine(st){
  const v = k => { const x = +(st[k]); return isFinite(x) ? x : 0; };
  if(st.valuation==null) return NaN;
  const pts=v('points'), reb=v('totalRebounds'), ast=v('assistances'), stl=v('steals'), blk=v('blocksFavour');
  const miss=(v('fieldGoalsAttempted2')-v('fieldGoalsMade2'))+(v('fieldGoalsAttempted3')-v('fieldGoalsMade3'))+(v('freeThrowsAttempted')-v('freeThrowsMade'));
  const tens=[pts,reb,ast,stl,blk].filter(x=>x>=10).length;
  return pts+2*reb+2*ast+3*stl+3*blk+v('foulsReceived')-2*v('turnovers')-miss-(v('foulsCommited')||v('foulsCommitted'))+(tens>=3?20:tens>=2?10:0);
}
let directBlocked = false;
async function pollDirect(){
  if(directBlocked || !LIVE.data) return;
  const now = Date.now();
  const games = (LIVE.data.games||[]).filter(g=>g.status!=='final' && g.utc &&
    now >= Date.parse(g.utc) && now <= Date.parse(g.utc)+3.5*3600e3);
  if(!games.length) return;
  let changed = false;
  for(const g of games){
    try{
      const r = await fetch(API+g.game+'/stats'); if(!r.ok) continue;
      let b = await r.json(); if(b.data && !b.local) b = b.data;
      const rows = [];
      for(const [side,team,opp] of [['local',g.home,g.away],['road',g.away,g.home]]){
        const sec = b[side] || b[side==='local'?'home':'away']; if(!sec) continue;
        let pl = sec.players||sec.playerStats||[]; if(pl.data) pl = pl.data;
        for(const line of pl){
          const st = line.stats||line.statistics||line;
          const s = secs(st.timePlayed??st.minutesPlayed??st.minutes), pir = fpLine(st);
          const name = pname(line.player||line.person);
          if(name && s>0 && isFinite(pir)) rows.push({raw:name, team, opp, game:g.game, pir, min:Math.round(s/6)/10, status:'live', asof:new Date().toISOString()});
        }
      }
      if(rows.length){ LIVE.direct.set(String(g.game), rows); changed = true; }
    }catch(e){ directBlocked = true; return; }   // CORS blocked - rely on live.json
  }
  if(changed){ rebuildLive(); renderAll(); }
}
setInterval(loadLive, 5*60e3);
setInterval(pollDirect, 60e3);

// Hits per round: predicted top K vs actual top K among everyone who played (ties at the cutoff count).
function currentRoundHits(){
  const rows = LIVE.rows||[]; if(!rows.length) return null;
  const pir = rows.map(a=>a.pir).sort((a,b)=>b-a);
  const ks = {t10:10,t30:30,t50:50}, out = {round:LIVE.round, n_played:rows.length, partial:!LIVE.roundDone, m1:{}, m2:{}};
  for(const [key,k] of Object.entries(ks)){
    const th = pir[Math.min(k,pir.length)-1];
    const act = new Set(rows.filter(a=>a.pir>=th).map(a=>akey(a.raw,a.team)));
    for(const m of MODELS){
      const top = P.filter(p=>p.ranked).sort((a,b)=>a.m[m.k].rank-b.m[m.k].rank).slice(0,k);
      out['m'+(m.k+1)][key] = top.filter(p=>act.has(akey(p.raw,p.team))).length;
    }
  }
  return out;
}
function hitsTable(){
  const H = [...(D.round_hits||[])];
  const cur = currentRoundHits();
  if(cur && !H.some(h=>h.round===cur.round)) H.push(cur);
  if(!H.length) return '';
  const full = H.filter(h=>!h.partial);
  const avg = t => full.length ? full.reduce((s,h)=>s+h.m2[t],0)/full.length : null;
  return `<div class="card hits">
    <h2>פגיעות לפי מחזור</h2>
    <div class="hint">כמה מהשחקנים שהמודל דירג בטופ K סיימו בפועל בטופ K של המחזור (מתוך כל מי ששיחק; שוויון בקו החיתוך נספר) · מחזורים קודמים = מבחן מחוץ למדגם עם המשקלים הקפואים</div>
    <div class="scroll"><table>
      <thead><tr><th>מחזור</th><th class="num">שיחקו</th><th class="num">טופ 10</th><th class="num">טופ 30</th><th class="num">טופ 50</th></tr></thead>
      <tbody>${H.sort((a,b)=>a.round-b.round).map(h=>`<tr${h.partial?' class="partial"':''}><td><b>${h.round}</b>${h.partial?' <span class="badge live sm">חלקי</span>':''}</td>
        <td class="num">${h.n_played}</td>${[['t10',10],['t30',30],['t50',50]].map(([t,k])=>`<td class="num">${h.m2[t]}<small class="note">/${k}</small></td>`).join('')}</tr>`).join('')}
      ${full.length?`<tr class="avg"><td><b>ממוצע</b></td><td></td>${['t10','t30','t50'].map(t=>`<td class="num"><b>${f(avg(t),1)}</b></td>`).join('')}</tr>`:''}

}

// ---------- B. Fixtures (current + future rounds) ----------
let fxRound = null;
const fmtRaw = raw => { const p = String(raw).split(','); const cap = x=>x.toLowerCase().replace(/(^|[\s\-'.])([a-z])/g,(m,a,b)=>a+b.toUpperCase()).trim();
  return p.length>1 ? cap(p.slice(1).join(' '))+' '+cap(p[0]) : cap(raw); };
function gameInfo(g){ return liveGame(g.game) || g; }
function gameStatus(g){ const i=gameInfo(g); return i.status || (g.played?'final':'scheduled'); }
function gameMid(g){

  const sc = i.hs!=null && i.as!=null ? `<b>${i.as} – ${i.hs}</b>` : '';   // LTR: away (left) – home (right)

function leaders(game, team){   // actual top fantasy points in this game for this team (ties: all of them)
  const rows = (LIVE.rows||[]).filter(a=>String(a.game)===String(game) && a.team===team);
  if(!rows.length) return null;
  const top = Math.max(...rows.map(a=>a.pir));
  return {pir:top, live:rows[0].status==='live', ps:rows.filter(a=>a.pir===top)};
}
function roundGames(r){
  const past = (LIVE.data && LIVE.data.past_games) || [];
  if(M.next_round!=null && r < M.next_round) return past.filter(g=>g.round===r).map(g=>({...g, status:'final'}));
  const sch = LIVE.data && LIVE.data.schedule;
  if(sch && sch.length) return sch.filter(g=>g.round===r);

}
function renderFixtures(){
  const sch = (LIVE.data && LIVE.data.schedule) || [];

  const isPred = fxRound===M.next_round;

  const byRaw = new Map(P.map(p=>[akey(p.raw,p.team),p]));

    const st = gameStatus(g);
    const stored = t===g.home ? g.lead_home : t===g.away ? g.lead_away : null;   // earlier rounds
    const ld = stored ? {pir:stored.fp, live:false, ps:(stored.raw||[]).map(r=>({raw:r, team:t}))}

    } else if(st==='scheduled' && teamTop[t]){ const tp=teamTop[t];
      sub = `<small>מוביל צפוי: <span class="pl" data-id="${tp.id}">${esc(tp.name)}</span> (${f(tp.m[1].pir,1)})</small>`; }
    const gi = gameInfo(g);
    if((st==='final'||st==='live') && gi.hs!=null && gi.as!=null){
      const home = t===g.home, pts = coachPtsFromScore(home?gi.hs:gi.as, home?gi.as:gi.hs);
      const c = (D.coaches||[]).find(x=>x.team===t);

  $('#fixtures').innerHTML =
    `<div class="card rnav" style="margin-bottom:16px">
       <button class="btn ghost" id="fxPrev" ${i<=0?'disabled':''}>→ מחזור קודם</button>
       <div><h2>מחזור ${fxRound??''}${isPred?' <span class="tag">תחזית פעילה</span>':(M.next_round!=null&&fxRound<M.next_round?' <span class="tag">הסתיים</span>':'')}</h2>
       <div class="hint">שעות לפי שעון ישראל · ${isPred?'"מוביל צפוי" = הצפי הגבוה בקבוצה · ':''}"מוביל בפועל" = ניקוד הפנטזי הגבוה בקבוצה במשחק</div></div>

    (fx.length ? Object.keys(groups).sort().map(k=>`<div class="day"><h3>${dayFmt.format(dateOnly(k))}</h3><div class="games">${
      groups[k].map(g=>`<div class="game ${gameStatus(g)==='final'?'played':''} ${gameStatus(g)==='live'?'is-live':''}">
        ${team(g,g.home)}
        <div class="mid">${gameMid(g)}</div>
        ${team(g,g.away)}</div>`).join('')}</div></div>`).join('') : '<div class="empty">אין משחקים בלוח למחזור זה</div>');

// ---------- F. Ideal five (sport5 rules: 5 starters, 1-3 G / 1-3 F / 1-2 C, max 2 per club, captain x2) ----------
const BUILD = {budget:null, model:1, injured:true, excluded:new Set()};   // model index 1 = Model 2
const POS3 = ['Guard','Forward','Center'];
const LIM = {Guard:[1,3], Forward:[1,3], Center:[1,2]};
function buildPool(){
  return P.filter(p=>p.ranked && p.price!=null && p.s5pos && POS3.includes(p.s5pos) && !(BUILD.injured && (p.injured || p.out3)) && !BUILD.excluded.has(p.id))
          .map(p=>({p, fp:p.m[BUILD.model].pir, price:p.price, pos:p.s5pos, team:p.team}))
          .filter(x=>x.fp!=null);
}
// keep a player only if fewer than 3 same-position players are both cheaper-or-equal and better
// (3 instead of 1 so the max-2-per-club rule can still be satisfied)
function prune(pool, budget){
  return pool.filter(x=>x.price<=budget && pool.filter(y=>y!==x && y.pos===x.pos && y.price<=x.price && y.fp>=x.fp && (y.price<x.price||y.fp>x.fp)).length<3);
}
function solveFive(budget){
  const c = prune(buildPool(), budget).sort((a,b)=>b.fp-a.fp);
  let best = null, bestVal = -Infinity;
  const cnt = {Guard:0, Forward:0, Center:0}, team = {}, pick = [];
  function feasibleEnd(){ return POS3.every(q=>cnt[q]>=LIM[q][0]); }
  function rec(i, cost, sum, cap){
    if(pick.length===5){ if(feasibleEnd()){ const v=sum+cap; if(v>bestVal){bestVal=v; best=[...pick];} } return; }
    const need = 5-pick.length;
    // optimistic bound: next `need` best fp from i (sorted desc) + captain bonus
    let ub = sum, mx = cap;
    for(let j=i, t=0; j<c.length && t<need; j++, t++){ ub+=c[j].fp; if(t===0) mx=Math.max(mx,c[j].fp); }
    if(ub+mx <= bestVal) return;
    // minimum required slots per position must still fit
    const req = POS3.reduce((s,q)=>s+Math.max(0,LIM[q][0]-cnt[q]),0); if(req>need) return;
    for(let j=i; j<c.length; j++){
      const x = c[j];
      if(cost+x.price>budget || cnt[x.pos]>=LIM[x.pos][1] || (team[x.team]||0)>=2) continue;
      cnt[x.pos]++; team[x.team]=(team[x.team]||0)+1; pick.push(x);
      rec(j+1, cost+x.price, sum+x.fp, Math.max(cap,x.fp));
      pick.pop(); team[x.team]--; cnt[x.pos]--;
    }
  }
  rec(0,0,0,0);
  return best ? {five:best, total:bestVal} : null;
}

// Full squad (sport5 rules, no coach): 5 starters (1-3 G, 1-3 F, 1-2 C) + bench 1 G + 1 F + 1 C,
// max 2 per club, captain (best starter) x2, bench scores 50%.
// Objective = starters + captain bonus + bench/2. Exact branch & bound.
// opts: {budget, noStart:Set(ids), noSquad:Set(ids)}; pool items: {p, fp, price, pos, team}
function solveSquad(pool, opts){
  const POSL = ['Guard','Forward','Center'], LIMS = {Guard:[1,3], Forward:[1,3], Center:[1,2]};
  pool = pool.filter(x=>!opts.noSquad.has(x.p.id) && x.price<=opts.budget);
  // a player is useful only if fewer than 4 same-position players (a position can fill 4 slots) are cheaper-or-equal AND better
  const dom = x => pool.filter(y=>y!==x && y.pos===x.pos && y.price<=x.price && y.fp>=x.fp && (y.price<x.price||y.fp>x.fp)).length;
  const c = pool.filter(x=>dom(x)<4).sort((a,b)=>b.fp-a.fp);
  const n = c.length;
  // suffix best fp per position (for the bench bound)
  const suf = {}; for(const q of POSL){ suf[q]=new Array(n+1).fill(0); for(let i=n-1;i>=0;i--) suf[q][i]=Math.max(suf[q][i+1], c[i].pos===q?c[i].fp:0); }
  const minP = {}; for(const q of POSL) minP[q] = Math.min(...c.filter(x=>x.pos===q).map(x=>x.price));
  const minAny = Math.min(...c.map(x=>x.price));
  const st = {Guard:0,Forward:0,Center:0}, bench = {Guard:null,Forward:null,Center:null}, team = {...(opts.teamInit||{})}, starters = [];
  let best = null, bestVal = -Infinity, nodes = 0;
  function rec(i, cost, valS, cap, valB){
    nodes++;
    const nS = starters.length, benchLeft = POSL.filter(q=>!bench[q]);
    if(nS===5 && !benchLeft.length){
      const v = valS + cap + valB/2;
      if(v>bestVal){ bestVal=v; best={starters:[...starters], bench:{...bench}, total:v, cost}; }
      return;
    }
    if(i>=n) return;
    // cost lower bound for the slots still open
    let need = 0; for(const q of POSL) need += Math.max(0, LIMS[q][0]-st[q]);
    if(need > 5-nS) return;
    const lb = benchLeft.reduce((s,q)=>s+minP[q],0) + POSL.reduce((s,q)=>s+Math.max(0,LIMS[q][0]-st[q])*minP[q],0) + (5-nS-need)*minAny;
    if(cost+lb > opts.budget) return;
    // value upper bound
    let ub = valS + valB/2, mx = cap;
    for(let j=i,t=0; j<n && t<5-nS; j++,t++){ ub += c[j].fp; if(t===0) mx = Math.max(mx, c[j].fp); }
    for(const q of benchLeft) ub += suf[q][i]/2;
    if(ub + mx <= bestVal + 1e-9) return;
    for(let j=i; j<n; j++){
      const x = c[j];
      if(cost+x.price>opts.budget || (team[x.team]||0)>=2) continue;
      team[x.team]=(team[x.team]||0)+1;
      if(nS<5 && st[x.pos]<LIMS[x.pos][1] && !opts.noStart.has(x.p.id)){
        st[x.pos]++; starters.push(x);
        rec(j+1, cost+x.price, valS+x.fp, Math.max(cap,x.fp), valB);
        starters.pop(); st[x.pos]--;
      }
      if(!bench[x.pos]){
        bench[x.pos]=x;
        rec(j+1, cost+x.price, valS, cap, valB+x.fp);
        bench[x.pos]=null;
      }
      team[x.team]--;
    }
  }
  rec(0,0,0,0,0);
  return best ? {...best, nodes, cands:n} : null;
}

// ---------- coaches: projection (season point differential + home court) and cards ----------
const coachFp = (c, h=0) => (c && c.fut && c.fut[h]!=null) ? c.fut[h] : 0;
const coachOpp = c => c && c.opp ? `${c.venue==='Home'?'נגד':'@'} ${tShort(c.opp)}` : '';
// coach fantasy points from a score: win = 5 + margin, loss = -(5 + margin)
const coachPtsFromScore = (own, opp) => own>opp ? 5+(own-opp) : own<opp ? -(5+(opp-own)) : 0;
// the team's game in the current round (final or in progress) -> {pts, live, score}
function coachActual(team){
  const L = LIVE.data; if(!L || !team) return null;
  const g = (L.games||[]).find(x=>(x.home===team||x.away===team) && (x.status==='final'||x.status==='live') && x.hs!=null && x.as!=null);
  if(!g) return null;
  const home = g.home===team, own = home?g.hs:g.as, opp = home?g.as:g.hs;
  return {pts:coachPtsFromScore(own,opp), live:g.status==='live', score:`${own}–${opp}`};
}
function coachActualTag(c){
  const a = c && coachActual(c.team); if(!a) return '';
  const v = `<bdi dir="ltr">${a.pts>0?'+':''}${a.pts}</bdi>`;
  return a.live ? `<div class="cact live"><span class="badge live sm"><i></i>LIVE ${v}</span><small>${a.score}</small></div>`
                : `<div class="cact"><span class="badge final sm">✓ ${v}</span><small>${a.score}</small></div>`;
}

// ---------- G. Full squad: five + bench + coach ----------
const SQUAD = {noStart:new Set(), noSquad:new Set(), noCoach:new Set(), coach:'auto'};
// best squad + coach within 100M: try coaches (best projection first) and skip those that cannot win
function solveWithCoach(pool){
  const cs = (D.coaches||[]).filter(c=>c.fut && !SQUAD.noCoach.has(c.s5id) && !(BUILD.injured && c.injured));
  const list = SQUAD.coach==='auto' ? cs : cs.filter(c=>String(c.s5id)===String(SQUAD.coach));
  if(!list.length) return null;
  const base = {noStart:SQUAD.noStart, noSquad:SQUAD.noSquad};
  const cheapest = Math.min(...list.map(c=>c.price));
  const top = solveSquad(pool, {...base, budget:100-cheapest});      // upper bound for the players part
  let best = null;
  for(const c of [...list].sort((a,b)=>coachFp(b)-coachFp(a))){
    if(top && best && top.total + coachFp(c) <= best.total + 1e-9) continue;
    const r = solveSquad(pool, {...base, budget:100-c.price, teamInit:{[c.team]:1}});
    if(r && (!best || r.total + coachFp(c) > best.total)) best = {...r, coach:c, players:r.total, total:r.total + coachFp(c), cost:r.cost + c.price};
  }
  return best;
}

// ---------- H. My team: rank, percentile, ownership and transfers over a horizon (via the Cloudflare Worker) ----------
const WORKER = 'https://el-fantasy.aviv-tzafrir.workers.dev';
const S5POS = {1:'Guard', 2:'Forward', 3:'Center', 4:'Coach'};
const byS5 = new Map(P.filter(p=>p.s5id!=null).map(p=>[p.s5id,p]));
const FUT = (M.fut_rounds||[]);
const MT = {data:null, loading:false, err:null, rec:null, H:1, q:'', sel:0, thrSort:'risk', coachMode:'auto'};
// ownership (own.json, refreshed every 6 hours)
const OWN = {size:null, own:{}, updated:null};
const ownPct = p => (p && p.s5id!=null && OWN.size && OWN.own[p.s5id]!=null) ? 100*OWN.own[p.s5id]/OWN.size : null;
const ownTxt = p => { const v = ownPct(p); return v==null ? '' : `${v<1?f(v,1):f(v,0)}%`; };
async function loadOwn(){
  if(location.protocol==='file:') return;
  try{ const r = await fetch('own.json?t='+Date.now(), {cache:'no-store'}); if(!r.ok) return;
       const j = await r.json(); OWN.size=j.size; OWN.own=j.own||{}; OWN.updated=j.updated_utc; renderAll(); }catch(e){}
}
// projected fantasy points per future round (index 0 = next round); 0 if injured / out
function fpsOf(p, injured, H){
  const z = Array(H).fill(0);
  if(!p || injured || p.injured || p.out3 || !p.fut) return z;
  return p.fut.slice(0,H).map(v=>v||0);
}
// best lineup for one round h: bench 1 G + 1 F + 1 C (50%), five = the rest (1-3 G, 1-3 F, 1-2 C), captain x2
function lineupAt(sq, h){
  let best = null;
  const G = sq.filter(x=>x.pos==='Guard'), F = sq.filter(x=>x.pos==='Forward'), C = sq.filter(x=>x.pos==='Center');
  for(const g of G) for(const fw of F) for(const c of C){
    let n={Guard:0,Forward:0,Center:0}, sum=0, cap=null;
    for(const x of sq){ if(x===g||x===fw||x===c) continue; n[x.pos]++; sum+=x.fps[h]; if(!cap||x.fps[h]>cap.fps[h]) cap=x; }
    if(n.Guard<1||n.Guard>3||n.Forward<1||n.Forward>3||n.Center<1||n.Center>2) continue;
    const v = sum + cap.fps[h] + (g.fps[h]+fw.fps[h]+c.fps[h])/2;
    if(!best || v>best.v) best = {v, bench:[g,fw,c], cap};
  }
  if(!best) return null;
  best.starters = sq.filter(x=>!best.bench.includes(x));
  return best;
}
function squadValue(sq, H){ let t=0; for(let h=0;h<H;h++){ const l=lineupAt(sq,h); if(!l) return null; t+=l.v; } return t; }
// show each player leaving next to an incoming player of the same position where possible
function pairByPos(outs, ins){
  const left = [...ins], res = outs.map(o=>{ const i = left.findIndex(x=>x.pos===o.pos); return i>=0 ? left.splice(i,1)[0] : null; });
  return res.map(x=>x || left.shift());
}
function combos(arr, k, start=0, acc=[], out=[]){
  if(acc.length===k){ out.push([...acc]); return out; }
  for(let i=start;i<arr.length;i++){ acc.push(arr[i]); combos(arr,k,i+1,acc,out); acc.pop(); }
  return out;
}
// coach as a squad item (projection per round from the coach formula)
function coachItem(c, H){
  if(!c) return null;
  const d = (D.coaches||[]).find(x=>x.s5id===c.s5id) || c;
  const fps = Array.from({length:H},(_,h)=> d.injured ? 0 : coachFp(d,h));
  return {isCoach:true, s5id:d.s5id, c:d, name:d.he||d.raw||c.name, price:d.price??c.price, pos:'Coach', team:d.team||c.team, fps, tot:fps.reduce((a,b)=>a+b,0)};
}
// Top 3 transfer plans (0-3 transfers incl. the coach) by total projected points over the next H rounds.
// mode: 'auto' (the coach may be swapped), 'keep' (coach fixed), or a coach s5id (forced; counts as a transfer)
function recommend(sq, coach, bank, H, mode='auto'){
  const inSquad = new Set(sq.map(x=>x.s5id));
  const pool = P.filter(p=>p.ranked && p.s5id!=null && p.price!=null && POS3.includes(p.s5pos) && !p.injured && !p.out3 && !inSquad.has(p.s5id))
                .map(p=>{ const fps=fpsOf(p,false,H); return {s5id:p.s5id, p, name:p.he||p.name, price:p.price, pos:p.s5pos, team:p.team, fps, tot:fps.reduce((a,b)=>a+b,0)}; });
  sq.forEach(x=>{ x.fps = fpsOf(x.p, x.injured, H); x.tot = x.fps.reduce((a,b)=>a+b,0); });
  const cur = coachItem(coach, H);
  const coachPool = (D.coaches||[]).filter(c=>c.fut && !c.injured && (!cur || c.s5id!==cur.s5id)).map(c=>coachItem(c,H));
  // forced coach: apply the swap first, it uses one of the 3 transfers
  let baseCoach = cur, money0 = bank, forced = null;
  if(mode!=='auto' && mode!=='keep' && (!cur || String(cur.s5id)!==String(mode))){
    forced = coachPool.find(c=>String(c.s5id)===String(mode));
    if(forced){ money0 = bank + (cur?cur.price:0) - forced.price; baseCoach = forced; }
  }
  const coachSwappable = mode==='auto';
  const val = (players, c) => { const v = squadValue(players, H); return v==null ? null : v + (c?c.tot:0); };
  const baseV = val(sq, cur);
  const top = [];
  const push = plan => { top.push(plan); top.sort((a,b)=>b.v-a.v); if(top.length>3) top.pop(); };
  const extraOut = forced ? [cur].filter(Boolean) : [], extraIn = forced ? [forced] : [];
  const maxCap = arr => { let m=0; for(let h=0;h<H;h++){ let b=0; for(const x of arr) if(x.fps[h]>b) b=x.fps[h]; m+=b; } return m; };
  const kMax = 3 - (forced?1:0);
  if(!forced){ if(baseV!=null) push({k:0, v:baseV, outs:[], ins:[], left:bank, squad:sq, coach:cur}); }
  else if(money0 >= 0){
    const club = {}; [...sq, baseCoach].forEach(x=>club[x.team]=(club[x.team]||0)+1);
    if(Object.values(club).every(n=>n<=2)){ const v = val(sq, baseCoach); if(v!=null) push({k:1, v, outs:extraOut, ins:extraIn, left:money0, squad:sq, coach:baseCoach}); }
  }
  const items = coachSwappable && cur ? [...sq, cur] : [...sq];
  for(let k=1;k<=kMax;k++){
    for(const outs of combos(items,k)){
      const coachOut = outs.some(x=>x.isCoach);
      const keep = sq.filter(x=>!outs.includes(x));
      const keepCoach = coachOut ? null : baseCoach;
      const money = money0 + outs.reduce((s,x)=>s+x.price,0);
      if(money < 0) continue;
      const club = {}; [...keep, keepCoach].filter(Boolean).forEach(x=>club[x.team]=(club[x.team]||0)+1);
      const nPl = k - (coachOut?1:0);
      const cand = [];
      for(const q of POS3) cand.push(...pool.filter(x=>x.pos===q && x.price<=money && (club[x.team]||0)<2).sort((a,b)=>b.tot-a.tot).slice(0,8));
      const coachCand = coachOut ? coachPool.filter(c=>c.price<=money && (club[c.team]||0)<2).sort((a,b)=>b.tot-a.tot).slice(0,6) : [null];
      const keepTot = keep.reduce((s,x)=>s+x.tot,0);
      for(const nc of coachCand){
        const cc0 = {...club}; if(nc) cc0[nc.team]=(cc0[nc.team]||0)+1;
        const m2 = money - (nc?nc.price:0); if(m2 < 0) continue;
        const coachV = (nc || keepCoach) ? (nc || keepCoach).tot : 0;
        for(const ins of combos(cand.filter(x=>x.price<=m2), nPl)){
          let cost=0; for(const x of ins) cost+=x.price; if(cost>m2) continue;
          const cc = {...cc0}; let ok=true; for(const x of ins){ cc[x.team]=(cc[x.team]||0)+1; if(cc[x.team]>2){ok=false;break;} } if(!ok) continue;
          const ub = keepTot + ins.reduce((s,x)=>s+x.tot,0) + maxCap([...keep,...ins]) + coachV;
          if(top.length===3 && ub <= top[2].v) continue;
          const nsq = [...keep, ...ins], v = squadValue(nsq, H); if(v==null) continue;
          const tv = v + coachV;
          if(top.length<3 || tv>top[2].v) push({k:k+(forced?1:0), v:tv, outs:[...extraOut, ...outs], ins:[...extraIn, ...ins, ...(nc?[nc]:[])],
                                                 left:m2-cost, squad:nsq, coach:nc||keepCoach});
        }
      }
    }
  }
  return {baseV, plans:top, H};
}

// High-ownership players the team does not have, ranked by ownership x projected points (they hurt you if they score)
function threats(sq, H){

// ---------- Autocomplete ----------
const INDEX = P.map(p=>({p, hay:norm(p.name+' '+p.raw+' '+p.team+' '+(p.he||'')), nm:norm(p.name+' '+p.raw+' '+(p.he||''))}));
function searchPlayers(q, exclude){
  const toks = norm(q).split(/[\s,]+/).filter(Boolean);
  if(!toks.length) return [];
  const res = [];
  for(const it of INDEX){
    if(exclude.has(it.p.id)) continue;
    if(!toks.every(t=>it.hay.includes(t))) continue;
    const words = it.nm.split(/[\s,]+/);
    const pref = toks.every(t=>words.some(w=>w.startsWith(t)));
    res.push({p:it.p, s:(pref?0:2)+(it.p.ranked?0:1)});
  }
  res.sort((a,b)=>a.s-b.s || (b.p.avg||0)-(a.p.avg||0));
  return res.slice(0,12).map(r=>r.p);
}
function hl(text,q){
  let out = esc(text);
  norm(q).split(/[\s,]+/).filter(t=>t.length>0).forEach(t=>{
    const i = norm(text).indexOf(t);
    if(i>=0){ out = esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+t.length))+'</mark>'+esc(text.slice(i+t.length)); }
  });
  return out;
}
function makeSearch(container, placeholder, onPick, getExclude){
  container.innerHTML = `<input type="search" autocomplete="off" placeholder="${placeholder}"><div class="ac"></div>`;
  const inp = $('input',container), ac = $('.ac',container);
  let items=[], sel=-1;
  const draw = ()=>{
    const q = inp.value.trim();
    if(!q){ ac.classList.remove('on'); return; }
    items = searchPlayers(q, getExclude());
    ac.innerHTML = items.length ? items.map((p,i)=>`<div data-i="${i}" class="${i===sel?'sel':''}">
        <span><b>${hl(p.name,q)}</b> <small>· ${esc(p.he||p.raw)}</small></span>
        <small>${esc(p.team)} · ${p.pos_he}${p.ranked?'':' · לא מדורג'}</small></div>`).join('')
      : '<div class="none">לא נמצא שחקן</div>';
    ac.classList.add('on');
    ac.querySelectorAll('[data-i]').forEach(d=>d.onmousedown=e=>{e.preventDefault(); pick(+d.dataset.i);});
  };
  const pick = i=>{ const p=items[i]; if(!p) return; inp.value=''; ac.classList.remove('on'); sel=-1; onPick(p); };
  inp.oninput = ()=>{ sel=0; draw(); };
  inp.onkeydown = e=>{
    if(e.key==='ArrowDown'){ sel=Math.min(items.length-1,sel+1); draw(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ sel=Math.max(0,sel-1); draw(); e.preventDefault(); }
    else if(e.key==='Enter'){ pick(sel<0?0:sel); }
    else if(e.key==='Escape'){ ac.classList.remove('on'); }
  };
  inp.onblur = ()=>setTimeout(()=>ac.classList.remove('on'),120);
  inp.onfocus = ()=>{ if(inp.value.trim()) draw(); };
  return inp;
}

  const pv = $('#playerView'), ca = $('#cmpArea');
  $('#filterView').style.display = mode==='compare' ? 'none' : '';
  if(!current){ pv.innerHTML = ''; ca.innerHTML=''; $('#filterView').dataset.open='1'; renderFilter(); return; }
  $('#mainSearch').style.display = mode==='compare' ? 'none' : '';
  if(mode!=='compare'){ $('#filterView').dataset.open='0'; renderFilter(); }
  if(mode==='compare'){ pv.innerHTML=''; renderCompare(); return; }
  ca.innerHTML = '';
  pv.innerHTML = playerCard(byId.get(current));
  $('#goCompare').onclick = ()=>{ mode='compare'; compare=[current]; showCmpSearch=true; renderPlayer(); syncHash(); };
}
function openPlayer(id){ current=id; compare=[id]; mode='card'; showTab('search'); renderPlayer(); syncHash(); window.scrollTo({top:0,behavior:'smooth'}); }

// ---------- D. Comparison (up to 4 players) - replaces the player card ----------
let showCmpSearch = false;
function renderCompare(){
  const area = $('#cmpArea');
  const full = compare.length>=4;
  area.innerHTML = `<div class="card cmphead">
      <div class="phead"><h2>השוואת שחקנים</h2><button class="btn ghost" id="closeCmp">✕ סגור השוואה</button></div>
      <div class="cmpbar">
      ${compare.map((id,i)=>`<span class="pchip"><i style="background:${CMP_COLORS[i]}"></i>${esc(byId.get(id).name)}${compare.length>1?`<button data-rm="${id}" title="הסר">×</button>`:''}</span>`).join('')}
      <button class="btn" id="addCmp" ${full?'disabled':''}>+ הוסף שחקן</button>
      ${full?'<span class="note">מקסימום 4 שחקנים</span>':''}
      </div>
      <div class="sbox" id="cmpSearch" style="margin-top:12px;${showCmpSearch&&!full?'':'display:none'}"></div>
    </div>
    <div id="cmpTable"></div>`;
  area.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{compare=compare.filter(x=>x!==+b.dataset.rm); current=compare[0]; renderCompare(); syncHash();});
  const inp = makeSearch($('#cmpSearch'),'חפש שחקן להשוואה…',p=>{
      compare.push(p.id); showCmpSearch = compare.length<2; renderCompare(); syncHash();
    },()=>new Set(compare));
  $('#addCmp').onclick=()=>{ showCmpSearch=true; $('#cmpSearch').style.display=''; inp.focus(); };
  $('#closeCmp').onclick=()=>{ mode='card'; current=compare[0]; compare=[current]; renderPlayer(); syncHash(); };
  if(showCmpSearch && !full) setTimeout(()=>inp.focus(),0);
  $('#cmpTable').innerHTML = compareTable(compare.map(id=>byId.get(id)));
  $('#cmpTable').querySelectorAll('.pl').forEach(el=>el.onclick=()=>openPlayer(+el.dataset.id));
  $('#cmpTable').querySelectorAll('[data-img]').forEach(async el=>{
    const pp = byId.get(+el.dataset.img);
    const url = pp && pp.img ? pp.img : await wikiImage(pp);
    if(url && el.isConnected){ el.style.backgroundImage=`url("${url}")`; el.textContent=''; el.title=pp&&pp.img?'':'תמונה: ויקיפדיה'; }
  });
}
// ---------- player photos from Wikipedia (looked up in the browser, cached locally) ----------
const initials = p => (p.name||'').split(/\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
const IMG_KEY = 'el_wiki_img_v1';
let imgCache = {}; try{ imgCache = JSON.parse(localStorage.getItem(IMG_KEY)||'{}'); }catch(e){}
const imgPending = {};
// Look a person up on Wikipedia; `langs` = wikis to try in order (coaches: several languages,
// e.g. Spanish coaches often have no English article). Same safety check in every language:
// surname in the article title + "basketball" (in that language) in its description.
const BASKET_RE = /basketball|baloncesto|bàsquet|pallacanestro|basket|basketbol|krepšin|basquete/i;
function wikiImage(p, langs=['en'], keyPrefix=''){
  if(!p) return Promise.resolve(null);
  const key = keyPrefix + p.raw;
  if(key in imgCache) return Promise.resolve(imgCache[key]);
  if(imgPending[key]) return imgPending[key];
  const last = norm((p.raw.split(',')[0]||'').trim().split(/[\s-]+/)[0]);
  const one = lang => fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search`+
      '&gsrlimit=5&prop=pageimages|description&piprop=thumbnail&pithumbsize=240&gsrsearch='+encodeURIComponent(p.name+(lang==='en'?' basketball':'')))
    .then(r=>r.json()).then(j=>{
      const pages = Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index);
      const hit = pages.find(pg=>pg.thumbnail && norm(pg.title).includes(last) && (BASKET_RE.test(pg.description||'') || BASKET_RE.test(pg.title)));
      return hit ? hit.thumbnail.source : null; });
  return imgPending[key] = (async()=>{
    let url = null;
    for(const lang of langs){ url = await one(lang); if(url) break; }
    imgCache[key] = url; try{ localStorage.setItem(IMG_KEY, JSON.stringify(imgCache)); }catch(e){}
    return url;
  })().catch(()=>null);   // network error: not cached, retried next time
}
function compareTable(ps){
  const row = (label, get, opt={})=>{
    const vals = ps.map(get);
    let best = null;
    if(opt.best){ const nums = vals.map(v=>typeof v==='number'?v:null).filter(v=>v!=null);
      if(nums.length>=2) best = opt.best==='min'?Math.min(...nums):Math.max(...nums); }
    return `<tr class="${opt.cls||''}"><td>${label}</td>${vals.map(v=>`<td class="num ${best!=null&&v===best?'best':''}">${
      typeof v==='number' ? f(v,opt.d??2) : (v??'–')}</td>`).join('')}</tr>`;
  };
  const sec = (t,cls='')=>`<tr><td class="sec ${cls}" colspan="${ps.length+1}">${t}</td></tr>`;
  const mm = (p,k,key)=>p.ranked?p.m[k][key]:null;
  const acts = ps.map(getActual);
  let h = `<div class="card cmp"><div class="hint">הערך הטוב ביותר בכל שורה מודגש בירוק</div><div class="scroll"><table>
    <thead><tr><th class="corner"></th>${ps.map((p,i)=>`<th class="pc"><div class="pcw">
      <div class="ph" data-img="${p.id}" style="border-color:${CMP_COLORS[i]}">${esc(initials(p))}</div>
      <div><span class="pl" data-id="${p.id}" style="cursor:pointer"><b>${esc(p.name)}</b></span>
      <small class="note">${tName(p.team)} · ${p.pos_he}</small></div></div></th>`).join('')}</tr></thead><tbody>`;
  if(acts.some(Boolean)){
    const anyLive = acts.some(a=>a&&a.status==='live');
    h += sec(`משחק המחזור – נתוני אמת${anyLive?' / LIVE':''} (לא חיזוי)`,'real');
    h += row('סטטוס', (p,i)=>{const a=getActual(p); return !a?'טרם שיחק':a.status==='live'
        ?'<span class="badge live"><i></i>LIVE</span>':'<span class="badge final">✓ שוחק</span>';}, {cls:'real'});
    h += row('פנטזי בפועל', p=>{const a=getActual(p); return a?a.pir:null;}, {best:'max',d:0,cls:'real'});
    h += row('דקות', p=>{const a=getActual(p); return a?a.min:null;}, {best:'max',d:1,cls:'real'});
    h += row(`דירוג אמיתי במחזור`, p=>{const a=getActual(p); return a?a.rank:null;}, {best:'min',d:0,cls:'real'});
    h += row('מתוך', p=>{const a=getActual(p); return a?(a.status==='live'?LIVE.nPlayed:LIVE.nFinal):null;}, {d:0,cls:'real'});
  }
  h += sec('כללי');
  h += row('יריבה במחזור', p=>p.opp?`<span dir="rtl">${p.venue==='Home'?'נגד':'@'} ${tName(p.opp)}</span>`:'אין משחק');
  h += row('תאריך', p=>fmtShortDate(p.date)||'–');
  h += row('משחקים', p=>p.games, {d:0});
  h += row('% אחזקה בפנטזי', p=>ownPct(p), {d:1});
  h += row('פנטזי ממוצע עונה', p=>p.avg, {best:'max'});
  h += row('פנטזי ממוצע 5 אחרונים', p=>p.l5, {best:'max'});
  h += row('דקות ממוצע עונה', p=>p.min, {best:'max',d:1});
  h += row('דקות ממוצע 5 אחרונים', p=>p.l5min, {best:'max',d:1});
  h += sec('קלטי המודל');
  h += row('פקטור יריבה – עונה', p=>p.ranked?p.inputs.msf:null, {best:'max',d:3});
  h += row('פקטור יריבה – 5 אחרונים', p=>p.ranked?p.inputs.ml5f:null, {best:'max',d:3});
  h += row('יחס דקות – עונה', p=>p.ranked?p.inputs.mr:null, {best:'max',d:3});
  h += row('יחס דקות – 5 אחרונים', p=>p.ranked?p.inputs.l5mr:null, {best:'max',d:3});
  for(const m of MODELS){
    h += sec(`<span class="dot ${m.cls}"></span> ${m.long} – חיזוי`);
    h += row('<b>Score</b>', p=>mm(p,m.k,'score'), {best:'max',d:2});
    h += row('דירוג', p=>mm(p,m.k,'rank'), {best:'min',d:0});
    h += row('<b>פנטזי צפוי</b>', p=>mm(p,m.k,'pir'), {best:'max',d:1});
    h += row('טווח פנטזי (80%)', p=>p.ranked&&p.m[m.k].lo!=null?`${f(p.m[m.k].lo,1)} – ${f(p.m[m.k].hi,1)}`:'–');
    h += row('בסיס פנטזי', p=>mm(p,m.k,'base'), {best:'max',d:2});
    h += row('פקטור יריבה', p=>mm(p,m.k,'matchup'), {best:'max',d:4});
    h += row('פקטור דקות', p=>mm(p,m.k,'minf'), {best:'max',d:4});
    h += row('פקטור בית/חוץ', p=>mm(p,m.k,'home'), {best:'max',d:4});
  }
  const unr = ps.filter(p=>!p.ranked);
  h += `</tbody></table></div>${unr.length?`<div class="warn">${unr.map(p=>`${esc(p.name)}: ${esc(p.reason)}`).join('<br>')}</div>`:''}</div>`;
  return h;
}

// ---------- hash state ----------
function syncHash(){
  const t = document.querySelector('nav button.on').dataset.tab;
  const h = t==='search' && compare.length ? `${mode==='compare'?'compare':'search'}/${compare.join(',')}` : t;
  history.replaceState(null,'','#'+h);
}
function readHash(){
  const h = location.hash.slice(1);
  if(h.startsWith('search')||h.startsWith('compare')){
    const ids = (h.split('/')[1]||'').split(',').map(Number).filter(id=>byId.has(id)).slice(0,4);
    if(ids.length){ current=ids[0]; compare=ids; mode = h.startsWith('compare')?'compare':'card'; showCmpSearch = mode==='compare'&&ids.length<2; }
    showTab('search');
  } else if(['top','fixtures','opp','build','myteam'].includes(h)) showTab(h);
}

// ---------- footer ----------
const bt = M.backtest||{};
$('#foot').innerHTML = `יעד: נקודות פנטזי לפי חוקי ערוץ הספורט · מודלים שאומנו על 2024/25–2025/26 (משקלים קפואים) · ` +
  MODELS.map(m=>{const b=bt['m'+(m.k+1)]; return b?`${m.name}: NDCG@10 ${b.ndcg}, Spearman ${b.spearman}`:''}).filter(Boolean).join(' · ') +
  ` · בקטסט על מחזורי 2026/27 (מחוץ למדגם)`;

makeSearch($('#mainSearch'),'חפש שחקן… (שם באנגלית/עברית או קבוצה)', p=>openPlayer(p.id), ()=>new Set());
function renderAll(){
  updateSubline(); renderTops(); renderFixtures(); renderOpp(); renderBuilder(); renderSquad();
  const ae = document.activeElement;   // do not rebuild the search area while the user is typing
  if(!(ae && ae.tagName==='INPUT' && $('#tab-search').contains(ae))) renderPlayer();
}
updateSubline(); renderTops(); renderFixtures(); renderOpp(); renderBuilder(); renderSquad(); renderMyTeam(); readHash(); renderPlayer();
loadLive().then(pollDirect); loadOwn();
window.addEventListener('hashchange', ()=>{ readHash(); renderPlayer(); });
})();
</script>
