name: Betting lines (OddsPapi)

# Closing point spreads of finished EuroLeague / Israeli league games (price history is free on OddsPapi;
# listing the fixtures uses 1 request per league per run). Manual for now.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: el-odds
  cancel-in-progress: false

jobs:
  lines:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Closing lines
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python3 -u tools/odds_lines.py
          git config user.name  "el-bot"
          git config user.email "el-bot@users.noreply.github.com"
          git add cm/data/odds/lines.csv cm/data/odds/upcoming.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Betting lines $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
