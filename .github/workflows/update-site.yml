name: EuroLeague round update

# GitHub often delays or skips scheduled runs. So instead of one run every 10 minutes,
# ONE evening run stays alive and checks every 10 minutes until 23:00 UTC (game window).
# Several start times are listed as backups: if a loop is already running, the later
# trigger waits in the queue and then runs once.
on:
  schedule:
    - cron: '17 * * * *'      # hourly: round-end check + in-round results
    - cron: '45 15 * * *'     # evening loop start (17:45 Israel winter time)
    - cron: '35 17 * * *'     # backup start
    - cron: '35 19 * * *'     # backup start
  workflow_dispatch:
    inputs:
      force:
        description: 'Run the full round prediction now even if no new round finished'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: el-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("httr","jsonlite","openxlsx"))'

      - name: Update (prediction only, no training) - loops every 10 min during game hours
        env:
          TZ: Asia/Jerusalem
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          git config user.name  "el-bot"
          git config user.email "el-bot@users.noreply.github.com"
          publish() {
            git add docs output
            if git diff --cached --quiet; then echo "Nothing new"; return 0; fi
            git commit -q -m "Update EuroLeague page $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase origin main || true
            git push -q && echo "Published"
          }
          Rscript R/EuroLeague_auto_update_v11.R $FORCE || echo "update failed"
          publish
          while [ "$(date -u +%H)" -ge 15 ] && [ "$(date -u +%H)" -lt 23 ]; do
            sleep 600
            Rscript R/EuroLeague_auto_update_v11.R || echo "update failed"
            publish
          done
