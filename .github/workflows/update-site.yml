name: EuroLeague round update

# GitHub often delays or skips scheduled runs. So instead of one run every 10 minutes,
# ONE evening run stays alive and checks every 10 minutes until 23:00 UTC (game window).
# Several start times are listed as backups: if a loop is already running, the later
# trigger waits in the queue and then runs once.
on:
  schedule:
    - cron: '17 * * * *'      # hourly: round-end check + in-round results
    - cron: '45 15 * * *'     # evening loop start (17:45 Israel winter time)
    - cron: '35 17 * * *'     # backup start
    - cron: '35 19 * * *'     # backup start
  workflow_dispatch:
    inputs:
      force:
        description: 'Run the full round prediction now even if no new round finished'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: el-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04      # pinned: 'latest' moved to a new Ubuntu and broke the cached R packages
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # R is usually preinstalled on the runner; install it only if missing, and never wait more
      # than 15 minutes (a network hiccup on the Ubuntu mirrors once hung this step for 1h45m)
      - name: Check for R
        id: r
        run: if command -v Rscript >/dev/null; then echo "have=true" >> "$GITHUB_OUTPUT"; Rscript --version; fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.r.outputs.have != 'true'
        timeout-minutes: 15
        with:
          use-public-rspm: true

      - name: OS and R version (cache key)
        id: ver
        run: echo "id=$(lsb_release -cs)-R$(Rscript -e 'cat(as.character(getRversion()))')" >> "$GITHUB_OUTPUT"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/R-lib
          key: rlib-${{ runner.os }}-${{ steps.ver.outputs.id }}-v2

      - name: Install R packages
        timeout-minutes: 10
        run: |
          mkdir -p ~/R-lib && echo "R_LIBS_USER=$HOME/R-lib" >> "$GITHUB_ENV"
          R_LIBS_USER=$HOME/R-lib Rscript -e '
            pk <- c("httr","jsonlite","openxlsx")
            need <- pk[!vapply(pk, requireNamespace, logical(1), quietly = TRUE)]   # missing OR not loadable
            if (length(need)) {
              options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(), paste(getRversion(), R.version$platform, R.version$arch, R.version$os)))
              rel <- tryCatch(system("lsb_release -cs", intern = TRUE), error = function(e) "noble")
              install.packages(need, lib = Sys.getenv("R_LIBS_USER"),
                               repos = c(sprintf("https://p3m.dev/cran/__linux__/%s/latest", rel), "https://cloud.r-project.org"))
              bad <- pk[!vapply(pk, requireNamespace, logical(1), quietly = TRUE)]
              if (length(bad)) install.packages(bad, lib = Sys.getenv("R_LIBS_USER"), repos = "https://cloud.r-project.org", type = "source")
            }
            stopifnot(all(sapply(c("httr","jsonlite","openxlsx"), requireNamespace, quietly = TRUE)))'

      - name: Update (prediction only, no training) - loops every 10 min during game hours
        env:
          TZ: Asia/Jerusalem
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          git config user.name  "el-bot"
          git config user.email "el-bot@users.noreply.github.com"
          # Never let a publish problem end the loop: our files are regenerated from scratch every
          # time, so on a clash with another run's commit we keep ours; if that still fails we drop
          # this round of changes and continue (the next iteration publishes fresh files anyway).
          publish() {
            git add docs output
            if git diff --cached --quiet; then echo "Nothing new"; return 0; fi
            git commit -q -m "Update EuroLeague page $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              if git pull -q --rebase -X theirs origin main && git push -q; then echo "Published"; return 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "Publish failed - skipped"; git reset -q --hard origin/main || true
          }
          sync_code() {   # pick up code changes pushed meanwhile
            git pull -q --rebase -X theirs origin main || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; } || true
          }
          START=$(date +%s)
          Rscript R/EuroLeague_auto_update_v12.R $FORCE || echo "update failed"
          publish
          # loop during game hours, but leave before GitHub's 6-hour job limit (the next run takes over)
          while [ "$(date -u +%H)" -ge 15 ] && [ "$(date -u +%H)" -lt 23 ] && [ $(( $(date +%s) - START )) -lt 19800 ]; do
            sleep 600
            sync_code
            Rscript R/EuroLeague_auto_update_v12.R || echo "update failed"
            publish
          done
