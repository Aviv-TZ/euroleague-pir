name: OddsPapi check

# Manual only: checks the OddsPapi key and what it covers (EuroLeague / Israeli league, past lines).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python3 tools/odds_probe.py
          git config user.name  "el-bot"
          git config user.email "el-bot@users.noreply.github.com"
          git add cm/data/odds
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "OddsPapi check $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
